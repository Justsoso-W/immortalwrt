name: Build OAF ipk for 6.12.45 (msm8916 stock device)

# Build ONLY the OAF packages (kmod-oaf + appfilter + luci-app-oaf) as ipks that can be
# `opkg install`-ed onto the running stock device (ImmortalWrt SNAPSHOT r35810,
# kernel 6.12.45, msm89xx/msm8916) WITHOUT flashing.
#
# Why a separate source + injected config:
#   kmod-oaf is a kernel module; it only loads if its vermagic matches the running
#   kernel. The stock device was built from immortalwrt/immortalwrt@b08962bcb7
#   (build timestamp matches `uname` exactly). We rebuild from that SAME commit and
#   inject the device's own /proc/config.gz (saved as device-kernel-config-6.12.45.config)
#   as the kernel config, so the produced kmod-oaf vermagic == device vermagic
#   (6.12.45 SMP preempt mod_unload aarch64). This is NOT satisfied by our July fork
#   firmware build, whose kernel was built from a different tree/date.
#
# Packaging: the device uses OPKG (.ipk). Stock tree defaults to APK (.apk), so we
# force CONFIG_USE_APK=n + CONFIG_PACKAGE_opkg=y and guard it after defconfig.

on:
  workflow_dispatch:
  push:
    branches: [ fix/build-stability ]
    paths:
      - '.github/workflows/build-oaf-ipk.yml'

jobs:
  build-oaf:
    name: Build OAF ipks (6.12.45, vermagic-matched)
    runs-on: ubuntu-24.04

    env:
      DEVICE_TARGET: msm89xx
      DEVICE_SUBTARGET: msm8916
      STOCK_COMMIT: b08962bcb724964820a772e42b508f14b673282b
      EXPECTED_VERMAGIC: "6.12.45 SMP preempt mod_unload aarch64"

    steps:
      - name: Check environment
        run: |
            df -h
            nproc

      - name: Clean up runner disk space
        run: |
            sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache /usr/local/lib/android
            sudo docker system prune -af 2>/dev/null || true
            df -h /

      - name: Checkout device kernel config (sparse — config file only)
        uses: actions/checkout@v4
        with:
            repository: Justsoso-W/immortalwrt
            ref: fix/build-stability
            path: fork
            sparse-checkout: |
              device-kernel-config-6.12.45.config
            sparse-checkout-cone-mode: false

      - name: Install build dependencies
        run: |
            sudo apt-get update -y
            sudo apt-get install -y --no-install-recommends \
                build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
                gettext git libncurses5-dev libssl-dev python3-setuptools \
                rsync swig unzip zlib1g-dev file wget curl \
                qemu-utils python3 python3-pip \
                u-boot-tools device-tree-compiler ccache
            sudo apt-get clean

      - name: Clone ImmortalWrt @ exact stock commit
        run: |
            git clone --filter=blob:none https://github.com/immortalwrt/immortalwrt openwrt
            cd openwrt
            git checkout ${{ env.STOCK_COMMIT }}

      - name: Inject device kernel config (guarantees vermagic match)
        working-directory: ./openwrt
        run: |
            CFG="../fork/device-kernel-config-6.12.45.config"
            if [ ! -f "$CFG" ]; then
                echo "::error::device config not found at $CFG"
                exit 1
            fi
            cp "$CFG" target/linux/msm89xx/config-6.12
            if [ -f target/linux/msm89xx/msm8916/config-6.12 ]; then
                cp "$CFG" target/linux/msm89xx/msm8916/config-6.12
            fi
            echo "Injected device config ($(wc -l < "$CFG") lines) into target kernel config."

      - name: Clone OpenAppFilter feed
        working-directory: ./openwrt
        run: |
            git clone --depth=1 https://github.com/destan19/OpenAppFilter.git package/OpenAppFilter

      - name: Lift OpenAppFilter sub-packages into package/
        # destan19/OpenAppFilter has no top-level Makefile; three parallel sub-packages
        # (oaf -> kmod-oaf, open-app-filter -> appfilter, luci-app-oaf) must sit
        # directly under package/ so OpenWrt's package scanner picks them up.
        working-directory: ./openwrt
        run: |
            for p in oaf open-app-filter luci-app-oaf; do
                if [ -d "package/OpenAppFilter/$p" ]; then
                    rm -rf "package/$p"
                    mv "package/OpenAppFilter/$p" "package/$p"
                else
                    echo "::warning::sub-package $p not found in cloned repo"
                fi
            done
            rm -rf package/OpenAppFilter
            echo "=== lifted OAF sub-packages ==="
            ls -d package/oaf package/open-app-filter package/luci-app-oaf 2>/dev/null

      - name: Update & install feeds
        working-directory: ./openwrt
        run: |
            ./scripts/feeds update -a
            ./scripts/feeds install -a

      - name: Build configuration (OAF only + minimal base)
        working-directory: ./openwrt
        run: |
            printf '%s\n' \
                'CONFIG_TARGET_msm89xx=y' \
                'CONFIG_TARGET_msm89xx_msm8916=y' \
                'CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-jz02v10=y' \
                'CONFIG_PACKAGE_kmod-oaf=y' \
                'CONFIG_PACKAGE_appfilter=y' \
                'CONFIG_PACKAGE_luci-app-oaf=y' \
                'CONFIG_DEVEL=y' \
                'CONFIG_CCACHE=y' \
                'CONFIG_USE_APK=n' \
                'CONFIG_PACKAGE_opkg=y' \
                > .config
            make defconfig
            # Force OPKG packaging: stock tree defaults to APK (.apk) but the device uses opkg (.ipk).
            # USE_APK is `default y` (NOT select-ed), so an explicit =n in .config persists through the
            # whole build (downstream `make` steps use .config as-is; they do not re-run defconfig).
            # Patch .config directly and DO NOT run a second `make defconfig` here: a second defconfig
            # re-applies the `default y` and flips USE_APK back to =y, defeating the override.
            sed -i '/^CONFIG_USE_APK=/d' .config
            printf 'CONFIG_USE_APK=n\n' >> .config
            grep -q '^CONFIG_PACKAGE_opkg=y' .config || printf 'CONFIG_PACKAGE_opkg=y\n' >> .config
            grep -q '^CONFIG_USE_APK=n' .config || { echo "::error::failed to disable APK"; exit 1; }
            echo "=== Selected OAF packages ==="
            grep -E 'CONFIG_PACKAGE_(kmod-oaf|appfilter|luci-app-oaf)=' .config | sort
            echo "=== Packaging backend ==="
            grep -E 'CONFIG_USE_APK|CONFIG_PACKAGE_opkg=' .config | sort

      - name: Download sources
        working-directory: ./openwrt
        run: make download -j$(nproc) 2>&1 | tail -20

      - name: Build & install host tools + toolchain
        # Provides host m4/flex/bison/ccache (needed by kernel syncconfig/LEX) and the
        # aarch64-openwrt cross gcc/binutils (needed to compile the kernel + kmod-oaf).
        working-directory: ./openwrt
        run: |
            make tools/install -j$(nproc) 2>&1 | tee /tmp/tools.log | tail -5
            rc1=${PIPESTATUS[0]}; if [ $rc1 -ne 0 ]; then
                echo "::error::tools/install failed (rc=$rc1)"
                grep -iE 'error:|fatal|no rule|undefined|cannot' /tmp/tools.log | tail -40
                exit 1
            fi
            ls -l staging_dir/host/bin/m4 staging_dir/host/bin/flex staging_dir/host/bin/bison staging_dir/host/bin/ccache 2>&1 || true
            make toolchain/install -j$(nproc) 2>&1 | tee /tmp/toolchain.log
            rc2=${PIPESTATUS[0]}; if [ $rc2 -ne 0 ]; then
                echo "::error::toolchain/install failed (rc=$rc2)"
                echo "=== grep'd errors ==="
                grep -iE 'error:|fatal|no rule|undefined reference|make\[.*\]: \*\*\*|No space left' /tmp/toolchain.log | tail -50
                echo "=== tail of full toolchain log ==="
                tail -80 /tmp/toolchain.log
                echo "=== disk after failure ==="
                df -h / || true
                exit 1
            fi

      - name: Build kernel (target/linux/compile) for Module.symvers
        working-directory: ./openwrt
        run: |
            make target/linux/compile -j$(nproc) V=s 2>&1 | tail -400
            rc=${PIPESTATUS[0]}
            if [ $rc -ne 0 ]; then
                echo "::error::kernel build failed (rc=$rc)"
                exit 1
            fi

      - name: Build OAF packages
        working-directory: ./openwrt
        run: |
            make package/oaf/compile package/open-app-filter/compile package/luci-app-oaf/compile V=s 2>&1 | tail -200
            rc=${PIPESTATUS[0]}
            if [ $rc -ne 0 ]; then
                echo "::error::OAF build failed (rc=$rc)"
                exit 1
            fi

      - name: Verify kmod-oaf vermagic matches device
        working-directory: ./openwrt
        run: |
            KO_IPK=$(find bin -name 'kmod-oaf*.ipk' | head -1)
            if [ -z "$KO_IPK" ]; then
                echo "::error::kmod-oaf ipk not found"
                exit 1
            fi
            rm -rf /tmp/kochk && mkdir -p /tmp/kochk
            tar -xzf "$KO_IPK" -C /tmp/kochk 2>/dev/null || tar -xf "$KO_IPK" -C /tmp/kochk
            KOF=$(find /tmp/kochk -name 'oaf.ko' | head -1)
            if [ -z "$KOF" ]; then
                echo "::error::oaf.ko not found inside ipk"
                exit 1
            fi
            BUILT=$(modinfo "$KOF" | grep -i vermagic | sed 's/vermagic:[[:space:]]*//')
            echo "Built  vermagic: $BUILT"
            echo "Expect vermagic: ${{ env.EXPECTED_VERMAGIC }}"
            if [ "$BUILT" != "${{ env.EXPECTED_VERMAGIC }}" ]; then
                echo "::error::vermagic MISMATCH — module will not load on device"
                exit 1
            fi
            echo "vermagic matches device — kmod-oaf will load."

      - name: Collect OAF ipks
        working-directory: ./openwrt
        run: |
            mkdir -p /tmp/oaf-ipks
            # kmod-oaf lands in bin/targets/.../packages/, appfilter/luci in bin/packages/ — search whole bin/
            find bin \( -name 'kmod-oaf*.ipk' -o -name 'appfilter_*.ipk' -o -name 'luci-app-oaf*.ipk' \) | while read f; do
                cp "$f" /tmp/oaf-ipks/
            done
            echo "=== Collected OAF ipks ==="
            ls -la /tmp/oaf-ipks/

      - name: Upload OAF ipks
        uses: actions/upload-artifact@v4
        with:
            name: oaf-ipks-6.12.45
            path: /tmp/oaf-ipks/*.ipk
            retention-days: 90
            if-no-files-found: error
